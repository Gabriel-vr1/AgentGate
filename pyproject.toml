[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Evidence-backed release assurance for AI-agent changes."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
	"pydantic>=2,<3",
	"pydantic-settings>=2,<3",
]

[project.optional-dependencies]
foundry = ["azure-ai-projects==2.7.0", "azure-identity>=1.25,<2"]
dev = [
	"pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
agentgate = ["reviewer.html"]
