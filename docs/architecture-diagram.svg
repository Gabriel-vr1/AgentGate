<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080">
<rect width="960" height="1080" fill="white"/>
<style>text{font-family:Arial,sans-serif}</style>
<text x="60" y="55" font-size="29" fill="#103451" font-weight="bold">AgentGate | Evidence Before Authority</text>
<text x="60" y="91" font-size="19" fill="#233b4c">Three Foundry-backed model stages constrained by Python</text>
<rect x="60" y="120" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="152" font-size="24" font-weight="bold" fill="#103451">Reviewer input</text>
<text x="84" y="182" font-size="18" fill="#103451">Fixed scenario, baseline, candidate and execution mode</text>
<path d="M480 206v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="226" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="258" font-size="24" font-weight="bold" fill="#103451">Python validation + exact manifest diff</text>
<text x="84" y="288" font-size="18" fill="#103451">Strict schemas and confirmed field-level changes</text>
<path d="M480 312v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="332" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="364" font-size="24" font-weight="bold" fill="white">1  Change Analyst</text>
<text x="84" y="394" font-size="18" fill="white">Explains only the supplied deterministic diff</text>
<path d="M480 418v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="438" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="470" font-size="24" font-weight="bold" fill="white">2  Assurance Planner</text>
<text x="84" y="500" font-size="18" fill="white">Explains controlled risks, policy and selected assurance</text>
<path d="M480 524v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="544" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="576" font-size="24" font-weight="bold" fill="#103451">Deterministic policy + assurance engine</text>
<text x="84" y="606" font-size="18" fill="#103451">Checks blockers, stored evidence and the verdict floor</text>
<path d="M480 630v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="650" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="682" font-size="24" font-weight="bold" fill="white">3  Release Judge</text>
<text x="84" y="712" font-size="18" fill="white">Structured recommendation must match the Python floor</text>
<path d="M480 736v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="756" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="788" font-size="24" font-weight="bold" fill="#103451">Non-downgrade verdict guard</text>
<text x="84" y="818" font-size="18" fill="#103451">Validate references and reject conflicting model verdicts</text>
<path d="M480 842v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="862" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="894" font-size="24" font-weight="bold" fill="#103451">Auditable decision</text>
<text x="84" y="924" font-size="18" fill="#103451">APPROVE / CONDITIONAL / BLOCK + remediation + trace</text>
<text x="60" y="1010" font-size="18" fill="#233b4c">Responsibility flow; Python validates each handoff throughout.</text>
<text x="60" y="1042" font-size="18" fill="#233b4c">Model stages are not persistent portal agents. Local fallback is explicit.</text>
</svg>