<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1330" viewBox="0 0 960 1330">
<rect width="960" height="1330" fill="white"/>
<style>text{font-family:Arial,sans-serif}</style>
<text x="60" y="55" font-size="29" fill="#103451" font-weight="bold">AgentGate | Evidence Before Authority</text>
<text x="60" y="91" font-size="19" fill="#233b4c">Three Foundry-backed model stages constrained by Python</text>
<rect x="40" y="109" width="880" height="935" rx="10" fill="none" stroke="#087f83" stroke-width="2"/>
<text x="60" y="141" font-size="18" fill="#087f83" font-weight="bold">IMPLEMENTED PROTOTYPE BOUNDARY</text>
<rect x="60" y="158" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="190" font-size="24" font-weight="bold" fill="#103451">Reviewer input</text>
<text x="84" y="220" font-size="18" fill="#103451">Fixed scenario, baseline, candidate and execution mode</text>
<path d="M480 244v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="264" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="296" font-size="24" font-weight="bold" fill="#103451">Python validation + exact manifest diff</text>
<text x="84" y="326" font-size="18" fill="#103451">Strict schemas and confirmed field-level changes</text>
<path d="M480 350v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="370" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="402" font-size="24" font-weight="bold" fill="white">1  Change Analyst</text>
<text x="84" y="432" font-size="18" fill="white">Explains only the supplied deterministic diff</text>
<path d="M480 456v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="476" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="508" font-size="24" font-weight="bold" fill="white">2  Assurance Planner</text>
<text x="84" y="538" font-size="18" fill="white">Explains controlled risks, policy and selected assurance</text>
<path d="M480 562v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="582" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="614" font-size="24" font-weight="bold" fill="#103451">Deterministic policy + assurance engine</text>
<text x="84" y="644" font-size="18" fill="#103451">Checks blockers, stored evidence and the verdict floor</text>
<path d="M480 668v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="688" width="840" height="86" rx="10" fill="#087f83"/>
<text x="84" y="720" font-size="24" font-weight="bold" fill="white">3  Release Judge</text>
<text x="84" y="750" font-size="18" fill="white">Structured recommendation must match the Python floor</text>
<path d="M480 774v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="794" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="826" font-size="24" font-weight="bold" fill="#103451">Non-downgrade verdict guard</text>
<text x="84" y="856" font-size="18" fill="#103451">Validate references and reject conflicting model verdicts</text>
<path d="M480 880v18m-5-5 5 5 5-5" fill="none" stroke="#087f83" stroke-width="2"/>
<rect x="60" y="900" width="840" height="86" rx="10" fill="#eef5f8"/>
<text x="84" y="932" font-size="24" font-weight="bold" fill="#103451">Auditable decision</text>
<text x="84" y="962" font-size="18" fill="#103451">APPROVE / CONDITIONAL / BLOCK + remediation + trace</text>
<text x="60" y="1020" font-size="17" fill="#233b4c">Python validates every handoff. Model stages are not persistent agents.</text>
<rect x="40" y="1063" width="880" height="237" rx="10" fill="none" stroke="#103451" stroke-width="2" stroke-dasharray="8 6"/>
<text x="60" y="1100" font-size="21" fill="#103451" font-weight="bold">PLANNED PRODUCTION SERVICES - NOT IMPLEMENTED</text>
<text x="60" y="1140" font-size="18" fill="#233b4c">Authenticated endpoint + enterprise identity / RBAC + human approval</text>
<text x="60" y="1176" font-size="18" fill="#233b4c">Managed Foundry agents if appropriate; formal Foundry evaluators</text>
<text x="60" y="1212" font-size="18" fill="#233b4c">OpenTelemetry / Foundry traces to Application Insights; audit / retention</text>
<text x="60" y="1248" font-size="18" fill="#233b4c">Controlled CI/CD gate + regression evaluations before release</text>
<text x="60" y="1282" font-size="18" fill="#087f83">Preserve deterministic non-downgrade controls in every deployment.</text>
</svg>